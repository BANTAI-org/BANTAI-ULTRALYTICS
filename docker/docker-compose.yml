version: '3.8'

services:
  # Redis for pipeline coordination
  redis:
    image: redis:7-alpine
    container_name: bantai-redis
    ports:
      - "6379:6379"
    networks:
      - bantai-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  # Pipeline orchestrator
  orchestrator:
    profiles: ["legacy-rtsp"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.orchestrator
    container_name: bantai-orchestrator
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STREAM_1_PRIMARY_URL=${STREAM_1_PRIMARY_URL:-rtsp://rtsp-server:8554/cam0}
            - STREAM_1_BACKUP_URL=${STREAM_1_BACKUP_URL:-rtsp://rtsp-server:8554/cam0}
      - STREAM_1_OUTPUT_URL=${STREAM_1_OUTPUT_URL:-rtsp://output:8554/stream1}
      - STREAM_2_PRIMARY_URL=${STREAM_2_PRIMARY_URL:-rtsp://rtsp-server:8554/cam1}
            - STREAM_2_BACKUP_URL=${STREAM_2_BACKUP_URL:-rtsp://rtsp-server:8554/cam1}
      - STREAM_2_OUTPUT_URL=${STREAM_2_OUTPUT_URL:-rtsp://output:8554/stream2}
      - USE_GPU=${USE_GPU:-true}
      - MODEL_PATH=${MODEL_PATH:-/app/weights/best.pt}
      - ENABLE_TRACKING=${ENABLE_TRACKING:-true}
      - TRACK_THRESH=${TRACK_THRESH:-0.5}
      - TRACK_BUFFER=${TRACK_BUFFER:-30}
      - MATCH_THRESH=${MATCH_THRESH:-0.8}
    networks:
      - bantai-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Receives both SFU tracks and feeds decoded frames directly into YOLO.
  direct-frame-ml:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ml-pipeline
    command: ["scripts/direct_frame_runner.py"]
    environment:
      - PI_API_URL=${PI_API_URL:?Set Pi's Cloudflare Access hostname in .env}
      - CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID:?Set Cloudflare Access service token ID in .env}
      - CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET:?Set Cloudflare Access service token secret in .env}
      - CF_SFU_TURN_URLS=${CF_SFU_TURN_URLS:-}
      - CF_SFU_TURN_USERNAME=${CF_SFU_TURN_USERNAME:-}
      - CF_SFU_TURN_CREDENTIAL=${CF_SFU_TURN_CREDENTIAL:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MODEL_PATH=${MODEL_PATH:-/app/weights/best.pt}
      - USE_GPU=${USE_GPU:-true}
      - ENABLE_TRACKING=${ENABLE_TRACKING:-true}
      - TRACK_THRESH=${TRACK_THRESH:-0.5}
      - TRACK_BUFFER=${TRACK_BUFFER:-30}
      - MATCH_THRESH=${MATCH_THRESH:-0.8}
      - STREAM_1_OUTPUT_URL=${STREAM_1_OUTPUT_URL:-}
      - STREAM_2_OUTPUT_URL=${STREAM_2_OUTPUT_URL:-}
    depends_on:
      - redis
    networks:
      - bantai-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  camera-viewer:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./viewer:/usr/share/nginx/html:ro
    depends_on:
      - rtsp-server
    networks:
      - bantai-network
    restart: unless-stopped

  # RTSP output server (for H.264 encoded streams)
  rtsp-server:
    image: bluenviron/mediamtx:latest
    container_name: bantai-rtsp-server
    ports:
      - "8554:8554"  # RTSP
      - "8888:8888"  # WebRTC
      - "8889:8889"  # HLS
    networks:
      - bantai-network
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml

networks:
  bantai-network:
    name: bantai-network
    driver: bridge

volumes:
  redis-data:
