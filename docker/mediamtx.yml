# MediaMTX configuration for RTSP/H.264 streaming
logLevel: info
logDestinations: [stdout]

# RTSP server
rtspAddress: :8554
protocols: [tcp]
encryption: "no"

# Paths for output streams
paths:
  stream1:
    source: publisher
    sourceOnDemand: no
    runOnPublish: ""
    runOnDemand: ""
    
  stream2:
    source: publisher
    sourceOnDemand: no
    runOnPublish: ""
    runOnDemand: ""
    
  # Accept any other stream dynamically
  all:
    source: publisher

# WebRTC for browser viewing
webrtcAddress: :8889

# HLS for wider compatibility
hlsAddress: :8888
hlsAlwaysRemux: yes
