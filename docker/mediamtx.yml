# MediaMTX configuration for RTSP/H.264 streaming
logLevel: info
logDestinations: [stdout]

# RTSP server
rtspAddress: :8554
protocols: [tcp]
encryption: "no"

# Paths for input/output streams
paths:
  cam1:
    source: publisher
    sourceOnDemand: no

  cam2:
    source: publisher
    sourceOnDemand: no

  stream1:
    source: publisher
    sourceOnDemand: no

  stream2:
    source: publisher
    sourceOnDemand: no

  # Accept any other stream dynamically
  all:
    source: publisher

# WebRTC for browser viewing / WHIP ingestion
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcICEServers: []

# HLS for wider compatibility
hlsAddress: :8888
hlsAlwaysRemux: yes
