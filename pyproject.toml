[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bantai-ml"
version = "0.1.0"
description = "Machine learning pipeline for BANTAI object detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.0.0",
  "numpy>=1.24.0",
  "opencv-python>=4.8.0",
  "PyYAML>=6.0",
  "tqdm>=4.66.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
